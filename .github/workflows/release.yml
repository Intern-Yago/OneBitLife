name: Release & Build Expo APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'index.html'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/pages.yml'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Tipo de incremento de versão (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release-and-build:
    name: Release, Build APK and Publish
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Verificar Alterações Relevantes do App Mobile
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build_app=true" >> "$GITHUB_OUTPUT"
            echo "Disparo manual via workflow_dispatch: build liberado."
            exit 0
          fi

          # Detecta arquivos alterados no commit
          CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD)
          echo "Arquivos modificados no commit:"
          echo "$CHANGED"

          APP_CHANGES=$(echo "$CHANGED" | grep -E '^(src/|app\.json|package\.json|eas\.json|babel\.config\.js|metro\.config\.js|\.github/workflows/release\.yml)' || true)

          if [ -z "$APP_CHANGES" ]; then
            echo "Apenas arquivos web/docs/landing alterados. Pulando build do EAS Expo."
            echo "build_app=false" >> "$GITHUB_OUTPUT"
          else
            echo "Alterações de código mobile detectadas. Prosseguindo para build do EAS."
            echo "build_app=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 4. Instalar Dependências
        if: steps.filter.outputs.build_app == 'true'
        run: npm ci || npm install

      - name: 5. Executar Expo Doctor
        if: steps.filter.outputs.build_app == 'true'
        run: npx expo-doctor || true

      - name: 6. Configurar Usuário do Git
        if: steps.filter.outputs.build_app == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 7. Atualizar Versão, app.json e CHANGELOG.md (SemVer)
        if: steps.filter.outputs.build_app == 'true'
        id: versioning
        run: |
          BUMP="${{ github.event.inputs.release_type }}"
          if [ -z "$BUMP" ]; then
            COMMIT_MSG=$(git log -1 --pretty=%B)
            if echo "$COMMIT_MSG" | grep -iqE '(BREAKING CHANGE|major)'; then
              BUMP="major"
            elif echo "$COMMIT_MSG" | grep -iqE '^(feat|minor)'; then
              BUMP="minor"
            else
              BUMP="patch"
            fi
          fi
          echo "SemVer release type detectado: $BUMP"
          node .github/scripts/bump-version.js "$BUMP"

      - name: 8. Commit, Tag e Push das Alterações
        if: steps.filter.outputs.build_app == 'true'
        env:
          VERSION: ${{ steps.versioning.outputs.version }}
        run: |
          git add package.json app.json CHANGELOG.md
          if [ -f package-lock.json ]; then git add package-lock.json; fi
          git commit -m "chore(release): v${VERSION} [skip ci]" || true
          git tag -f "v${VERSION}"
          git push origin HEAD:${{ github.ref_name }} --tags -f

      - name: 9. Instalar EAS CLI Oficial
        if: steps.filter.outputs.build_app == 'true'
        run: npm install -g eas-cli

      - name: 10. Gerar e Baixar Build do APK via EAS Cloud
        if: steps.filter.outputs.build_app == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform android --profile androidApk --non-interactive --json > build-output.json
          BUILD_URL=$(jq -r '.[0].artifacts.buildUrl // empty' build-output.json)
          if [ -z "$BUILD_URL" ] || [ "$BUILD_URL" = "null" ]; then
            echo "Erro: URL do APK não retornada pelo build do EAS!"
            cat build-output.json
            exit 1
          fi
          echo "Baixando APK de: $BUILD_URL"
          curl -fL -o ./OneBitLife.apk "$BUILD_URL"

      - name: 11. Criar GitHub Release e Anexar o APK nos Assets
        if: steps.filter.outputs.build_app == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.versioning.outputs.version }}"
          name: "Release v${{ steps.versioning.outputs.version }}"
          body_path: RELEASE_NOTES.md
          files: ./OneBitLife.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
